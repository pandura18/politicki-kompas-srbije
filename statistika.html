<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statistika – Politički kompas Srbije</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Statistika – Politički kompas Srbije</h1>

    <p>
        Prosečni odgovori i prosečne ideološke pozicije korisnika
        koji su uradili Politički kompas Srbije.
    </p>
</header>

<main>

    <section class="card">

        <h2>Prosečan odgovor na svako pitanje</h2>

        <div id="statistics-questions">
            Učitavanje statistike...
        </div>

    </section>


    <section class="card">

        <h2>Prosečne ideološke pozicije</h2>

        <div id="statistics-ideology">
            Učitavanje statistike...
        </div>

    </section>


    <section class="card">

        <button onclick="window.location.href='index.html'">
            Nazad
        </button>

    </section>

</main>


<footer>

    <p>
        Politički kompas Srbije © 2026
    </p>

</footer>


<script>

const GOOGLE_SHEET_URL =
    "https://script.google.com/macros/s/AKfycbwzZpC-E2yf2NVNaq0-opshAmu3469Bf_1jhrTq8rRpUjl2Pwr2nelL6Go8VVVqRBs/exec";


function loadStatistics() {

    fetch(GOOGLE_SHEET_URL)

        .then(function(response) {

            if (!response.ok) {
                throw new Error(
                    "Greška pri učitavanju statistike."
                );
            }

            return response.json();

        })

        .then(function(data) {

            prikaziPitanja(data.pitanja);

            prikaziIdeologiju(data.ideologija);

        })

        .catch(function(error) {

            console.error(error);

            document.getElementById(
                "statistics-questions"
            ).innerHTML =
                "<p>Statistika trenutno nije dostupna.</p>";

            document.getElementById(
                "statistics-ideology"
            ).innerHTML = "";

        });

}


function formatNumber(value) {

    if (
        value === "" ||
        value === null ||
        typeof value === "undefined"
    ) {
        return "-";
    }

    return Number(value).toFixed(2).replace(".", ",");

}


function prikaziPitanja(pitanja) {

    let html =

        "<table>" +

        "<thead>" +

        "<tr>" +

        "<th>Pitanje</th>" +

        "<th>Prosečan odgovor</th>" +

        "</tr>" +

        "</thead>" +

        "<tbody>";


    pitanja.forEach(function(item) {

        html +=

            "<tr>" +

            "<td>" +
            item.pitanje +
            "</td>" +

            "<td>" +
            formatNumber(item.prosek) +
            "</td>" +

            "</tr>";

    });


    html +=

        "</tbody>" +

        "</table>";


    document.getElementById(
        "statistics-questions"
    ).innerHTML = html;

}


function prikaziIdeologiju(ideologija) {

    let html =

        "<table>" +

        "<thead>" +

        "<tr>" +

        "<th>Oblast</th>" +

        "<th>Prosečna ideološka pozicija</th>" +

        "</tr>" +

        "</thead>" +

        "<tbody>";


    ideologija.forEach(function(item) {

        html +=

            "<tr>" +

            "<td>" +
            item.oblast +
            "</td>" +

            "<td>" +
            formatNumber(item.prosek) +
            "</td>" +

            "</tr>";

    });


    html +=

        "</tbody>" +

        "</table>";


    document.getElementById(
        "statistics-ideology"
    ).innerHTML = html;

}


loadStatistics();

</script>

</body>
</html>
